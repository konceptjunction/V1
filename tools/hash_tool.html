<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KJ Lock Hash Tool</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:30px auto;padding:0 16px}input{width:100%;padding:8px;margin:6px 0 14px}code{display:block;background:#f2f4f8;padding:10px;word-break:break-all;border-radius:8px}</style></head>
<body><h2>KONCEPT JUNCTION – Setup Code / PIN hash tool</h2>
<p>Works offline. Nothing is sent anywhere. Paste the output into <b>assets/js/config.js → TEACHER_LOCK</b>.</p>
<label>New Setup Code</label><input id="c" type="text" placeholder="e.g. KJ-BALAJI-2026">
<label>New PIN</label><input id="p" type="text" inputmode="numeric" placeholder="e.g. 739251">
<button onclick="go()">Make hashes</button>
<h3>Paste this into config.js</h3><code id="o">–</code>
<script>
async function h(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function go(){const c=document.getElementById("c").value.trim(),p=document.getElementById("p").value.trim();
if(!c||!p){alert("Enter both");return}
document.getElementById("o").textContent='TEACHER_LOCK: {\n  setup_code_sha256: "'+await h(c)+'",\n  pin_sha256: "'+await h(p)+'"\n},'}
</script></body></html>
