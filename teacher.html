<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KJ Teacher Upload</title>
<meta name="theme-color" content="#1b3a6b">
<link rel="icon" href="assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  main{max-width:1320px;padding-bottom:30px}
  /* V5: tabs wrap onto 2 lines so every tab (incl. Settings) is visible */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 12px}
  .tabs button[data-tab="settings"]{border-color:var(--accent)}
  .setbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
  .sec-t td{vertical-align:middle}
  .sec-t select,.sec-t input{padding:6px 8px}
  details.card summary{cursor:pointer;font-weight:600}
  /* V13: Telugu typing */
  .te-btn.on{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;font-weight:700}
  body.te-on :is(#qt,#et,#ot0,#ot1,#ot2,#ot3,#nte,#ltt,#lbt,#pt,#tepad,[data-f$=".te"]){outline:2px dashed var(--accent);outline-offset:1px}
  .te-hint{position:absolute;z-index:90;display:none;background:#14213d;color:#fff;padding:5px 10px;border-radius:8px;font:14px "Noto Sans Telugu","Nirmala UI",system-ui,sans-serif;box-shadow:var(--shadow);pointer-events:none}
  .te-chart td{white-space:nowrap;padding:5px 8px}
  .topbar{flex-wrap:wrap}
  .tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px}
  .tabs button.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .two3{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
  @media(max-width:860px){.two,.two3{grid-template-columns:1fr}}
  /* V16: Subject + Exam Type first */
  .lock-note{display:none;margin:0 0 10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);font-size:14px}
  #impL.locked .lock-note{display:block}
  #impL.locked > :not(.lock-note):not(h3){opacity:.5}
  #impR.need{border:2px dashed var(--bad)}
  #impR.flash{animation:kjflash .5s 3}
  @keyframes kjflash{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 35%,transparent)}}
  .arrow-d{display:none}
  @media(max-width:860px){#impR{order:-1}.arrow-r{display:none}.arrow-d{display:inline}}
  textarea{min-height:64px}
  .optrow{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
  .qlist .qi{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 2px;font-size:13.5px}
  .qlist .qi .q{flex:1;min-width:0}
  .log{font:12px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:240px;overflow:auto;white-space:pre-wrap}
  .lock{max-width:380px;margin:40px auto;text-align:center}
  .lock img{width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:var(--shadow)}
  .dirty{color:var(--warn);font-weight:700}
  .chk{display:inline-flex;gap:5px;align-items:center;margin:0 10px 4px 0;color:var(--ink);font-size:13px}
  .chk input{width:auto}
</style>
</head>
<body>
<header class="topbar">
  <img class="logo" src="assets/icons/logo.png" alt="KJ">
  <div class="ttl"><b>KONCEPT JUNCTION</b><small>Teacher Upload</small></div>
  <span class="pill acc" id="dirtyPill" style="display:none"></span>
  <button class="tb-btn te-btn" id="teBtn" title="Telugu typing on/off (F2)">అ Telugu typing: OFF</button>
  <button class="tb-btn" id="teHelp" title="How to type Telugu">?</button>
  <button class="tb-btn" id="hdrSet" style="display:none">⚙️ Settings</button>
  <a class="tb-btn" href="home.html" style="text-decoration:none">Student view ↗</a>
</header>
<main id="t"></main>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/telugu.js"></script>
<script src="assets/js/teacher.js"></script>
</body>
</html>
